<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Cero Fricción</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ac:#ffd60a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform-origin:center}
canvas{display:none}
.res canvas{display:block}
.shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 22%,transparent 70%,rgba(0,0,0,.55));pointer-events:none}
.glass{background:rgba(24,24,27,.66);border:1px solid rgba(255,255,255,.14)}
#gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:44px;height:44px;padding:0;border-radius:50%;color:#fff;opacity:.6;display:grid;place-items:center}
#gear:active{opacity:1}
#pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 128px);padding:8px 16px;border-radius:99px;font-size:14px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#pill.on{opacity:1}
#pill.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-2px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#zb{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:99px}
.res #zb{display:none}
#zb button{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:#fff;font:600 14px system-ui,sans-serif;transition:.15s}
#zb button.on{background:rgba(255,255,255,.16);color:var(--ac);transform:scale(1.08)}
button{cursor:pointer}
#set{position:absolute;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
#set.open{display:flex}
.card{width:100%;max-width:520px;margin:0 auto;background:#1c1c1e;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
h2{margin:0 0 4px;font-size:20px}
label{display:block;margin:18px 0 8px;font-size:13px;color:#aeaeb2}
input{width:100%;padding:13px 14px;border:1px solid #3a3a3c;border-radius:12px;background:#000;color:#fff;font:16px ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
small{display:block;margin-top:6px;color:#8e8e93;font-size:12px}
.seg,.seg2{display:flex;padding:3px;border-radius:12px;background:#000}
.seg button,.seg2 button{flex:1;padding:10px 0;border:0;border-radius:9px;background:transparent;color:#aeaeb2;font:600 15px system-ui,sans-serif}
.seg button.on,.seg2 button.on{background:#3a3a3c;color:var(--ac)}
.seg2{flex-wrap:wrap;gap:3px}.seg2 button{min-width:96px}
#ok{width:100%;margin-top:24px;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#000;font:700 16px system-ui,sans-serif}
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="c"></canvas>
  <div class="shade"></div>
  <div id="pill" class="glass"></div>
  <button id="gear" class="ctl glass" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.6" stroke-width="3.2" stroke-dasharray="2.98 2.98"/><circle cx="12" cy="12" r="6"/></svg>
  </button>
  <div id="zb" class="ctl glass"></div>
  <div id="set" class="ctl">
    <div class="card">
      <h2>Ajustes</h2>
      <label for="key">Clave API de Google Gemini</label>
      <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">
      <small>Consíguela en aistudio.google.com/apikey. Se guarda solo en este dispositivo.</small>
      <label>Nivel de pensamiento</label>
      <div class="seg" data-k="think"><button data-v="low">Bajo</button><button data-v="mid">Medio</button><button data-v="high">Alto</button></div>
      <label>Zoom inicial</label>
      <div class="seg" data-k="zoom"><button data-v="0.5">.5x</button><button data-v="1">1x</button><button data-v="2">2x</button></div>
      <label>Cámara gran angular (.5x)</label>
      <div class="seg2" id="wide"></div>
      <small id="wh"></small>
      <button id="ok">Listo</button>
    </div>
  </div>
</div>
<audio id="sil" loop playsinline></audio>
<script>
const $=s=>document.querySelector(s);
const st=$('#stage'),vid=$('#v'),cv=$('#c'),pill=$('#pill'),zb=$('#zb'),sheet=$('#set'),keyI=$('#key'),sil=$('#sil');
const LVL={low:'LOW',mid:'MEDIUM',high:'HIGH'};
const MODEL='gemini-flash-latest';
const SYS=`Eres un profesor particular de programación, algoritmos, lógica y matemáticas que habla con el estudiante por audio, mientras este camina con audífonos. Recibes una foto de código, pseudocódigo, un diagrama de flujo, un ejercicio o apuntes.

Reglas de formato, porque tu respuesta se lee en voz alta:
- Solo texto plano en español: sin markdown, listas, viñetas, asteriscos, emojis ni bloques de código.
- Escribe los números con palabras y las variables como suenan: equis, ye, zeta, ene, eme.
- Nunca escribas símbolos matemáticos ni de programación (el signo de suma, el igual, paréntesis, llaves, punto y coma): escribe su nombre con palabras.
- Frases cortas, una sola instrucción por frase, para que la voz haga pausas.
- Empieza directo, sin saludos.

Primero decide qué pide la foto.

CASO A. La foto ya contiene código, un diagrama o una solución y no pide construir nada. Explícalo como un profesor, de forma conversacional: qué hace en general, el recorrido de la lógica y el propósito de cada bloque. En un diagrama recórrelo desde el inicio y di qué pasa por el sí y por el no en cada decisión. Señala los errores que veas. Traduce la sintaxis a lenguaje hablado, por ejemplo: se repite mientras i sea menor que diez. Máximo unas 350 palabras y cierra con un resumen en una frase.

CASO B. La foto es un ejercicio que pide resolver algo, hacer un diagrama de flujo o escribir código. Resuélvelo y dicta la solución para que el estudiante la dibuje o la escriba en su cuaderno mientras escucha, sin mirar la pantalla. Empieza con una frase que diga qué pide el ejercicio y qué vas a dictar. Luego dicta, en este orden y solo lo que el ejercicio pida: la solución matemática, el diagrama de flujo y el código. Al final resume en una frase cómo funciona la solución. Aquí no hay límite de palabras: es más importante dictar completo que ser breve, pero sin relleno.

Dictado de matemáticas. Dicta cada expresión en el orden en que se escribe y marca dónde empieza y dónde termina cada estructura, porque el oído no ve la agrupación. Ejemplo: Escribe ocho más cinco. Debajo pon una raya de fracción y, bajo la raya, escribe dos. Fin de la fracción. A la derecha escribe el signo igual, deja un espacio y escribe siete. Para paréntesis di abre paréntesis y cierra paréntesis. Para potencias di elevado a la dos, fin del exponente. Para raíces di raíz cuadrada de, y al terminar, fin de la raíz. Después del dictado, resuelve paso a paso: en cada paso vuelve a dictar la expresión que resulta, de la misma forma, y di el resultado parcial. Termina diciendo con claridad la respuesta final.

Dictado de diagramas de flujo. Dicta las figuras de arriba hacia abajo, siempre con los mismos nombres: óvalo para inicio y fin, paralelogramo para entrada y salida de datos, rectángulo para procesos, rombo para decisiones y círculo pequeño para conectores. Ejemplo: Dibuja un óvalo y escribe dentro: Inicio. Debajo, dibuja una flecha hacia abajo. Dibuja un paralelogramo y escribe dentro: leer ene. En cada rombo di qué se escribe dentro, de qué lado sale el sí, de qué lado sale el no y qué se escribe sobre cada flecha. Dicta cada camino hasta que se una con otro o regrese a una figura anterior, nombrando esa figura. Al terminar di: fin del diagrama.

Dictado de código. Dicta el código línea por línea, empezando cada una con su número: Línea uno. Las palabras clave y los nombres cortos, de hasta cuatro letras, como int, cin, for, i o n, se deletrean diciendo el nombre de cada letra, por ejemplo: i ene te. Los nombres largos se dicen enteros después de avisar, por ejemplo: escribe la palabra contador, todo junto y en minúsculas. Los símbolos se dicen por su nombre: numeral, abre paréntesis, cierra paréntesis, abre llave, cierra llave, punto y coma, signo igual, doble signo igual, signo menor que, más más, comillas dobles, guion bajo. Indica los espacios (deja un espacio), las sangrías (deja cuatro espacios) y los saltos de línea (presiona enter para pasar a la siguiente línea). Si algo va en mayúscula, dilo. Al terminar di: fin del código.`;

let S={key:'',think:'mid',zoom:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('zf')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('zf',JSON.stringify(S))}catch(e){}};
const say=(t,busy)=>{pill.textContent=t;pill.classList.toggle('busy',!!busy);pill.classList.toggle('on',!!t)};

/* ---------- Cámara y zoom ---------- */
let stream,track,hw=false,cap={},zoom=1,mainId=null,curId=null,backs=[];
async function openCam(id){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({width:{ideal:1920},height:{ideal:1080}},id?{deviceId:{exact:id}}:{facingMode:{ideal:'environment'}}),audio:false});
  vid.srcObject=stream;
  track=stream.getVideoTracks()[0];
  curId=track.getSettings().deviceId||id;
  cap=track.getCapabilities?track.getCapabilities():{};
  hw=!!cap.zoom&&cap.zoom.max>=2;
  if(cap.focusMode&&cap.focusMode.includes('continuous'))track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
}
async function cam(){
  try{await openCam(null)}catch(e){say('Permite el acceso a la cámara para empezar');return}
  mainId=curId;
  try{
    const d=await navigator.mediaDevices.enumerateDevices();
    backs=d.filter(x=>x.kind==='videoinput'&&/back|rear|trasera/i.test(x.label)&&x.deviceId!==mainId);
  }catch(e){backs=[]}
  if(S.wide&&!backs.some(x=>x.deviceId===S.wide))S.wide='';
  drawBar();drawWide();setZoom(S.zoom);
}
function drawBar(){
  zb.innerHTML=[...(S.wide?[.5]:[]),1,2].map(z=>`<button data-z="${z}">${z<1?'.5':z}x</button>`).join('');
}
function drawWide(){
  const g=$('#wide');
  g.innerHTML='<button data-id="">Ninguna</button>'+backs.map((x,i)=>`<button data-id="${x.deviceId}">Cámara ${i+2}</button>`).join('');
  g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',(S.wide||'')===b.dataset.id));
  $('#wh').textContent=backs.length?'Toca cada cámara y mira la vista de arriba: la gran angular es la que muestra más escena. Evita las que se vean negras o borrosas.':'El navegador no mostró otras cámaras traseras en este teléfono.';
}
$('#wide').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  S.wide=b.dataset.id;save();drawWide();drawBar();
  setZoom(S.wide?.5:1);
};
async function setZoom(z){
  if(z<1&&!S.wide)z=1;
  const want=z<1?S.wide:mainId;
  try{if(want&&curId!==want)await openCam(want)}
  catch(e){say('No se pudo cambiar de cámara');z=1;try{await openCam(mainId)}catch(_){}}
  zoom=z;vid.style.transform='';
  if(z>=1){
    if(hw)track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
    else vid.style.transform=`scale(${z})`;
  }
  zb.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.z===z));
}
zb.onclick=e=>{const b=e.target.closest('button');if(b)setZoom(+b.dataset.z)};

async function snap(){
  let src=vid,sw=vid.videoWidth,sh=vid.videoHeight,sx=0,sy=0;
  try{
    if(window.ImageCapture){
      const ic=new ImageCapture(track),pc=await ic.getPhotoCapabilities();
      const w=pc.imageWidth?Math.min(pc.imageWidth.max,4000):0;
      const blob=await Promise.race([ic.takePhoto(w?{imageWidth:w}:{}),new Promise((_,r)=>setTimeout(r,5000))]);
      src=await createImageBitmap(blob);sw=src.width;sh=src.height;
    }
  }catch(e){src=vid;sw=vid.videoWidth;sh=vid.videoHeight}
  if(!hw&&zoom>1){const nw=sw/zoom,nh=sh/zoom;sx=(sw-nw)/2;sy=(sh-nh)/2;sw=nw;sh=nh}
  const k=Math.min(1,1600/Math.max(sw,sh));
  cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
  cv.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',.85).split(',')[1];
}

/* ---------- Gemini ---------- */
async function ask(b64){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),120000);
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent',{
      method:'POST',signal:ac.signal,
      headers:{'Content-Type':'application/json','x-goog-api-key':S.key},
      body:JSON.stringify({
        systemInstruction:{parts:[{text:SYS}]},
        contents:[{role:'user',parts:[{inline_data:{mime_type:'image/jpeg',data:b64}},{text:'Explícame esto por audio.'}]}],
        generationConfig:{thinkingConfig:{thinkingLevel:LVL[S.think]}}
      })
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error&&j.error.message||('HTTP '+r.status));
    const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join(' ').trim();
    if(!t)throw new Error('La respuesta llegó vacía');
    return t;
  }finally{clearTimeout(to)}
}

/* ---------- Audio: voz por frases, bucle y retroceso de 5 s ---------- */
const P={ch:[],i:0,d:[],t0:0,on:0,pz:0,tok:0,el:0};
let V=null;
function pickVoice(){
  const l=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  V=l.find(v=>/es[-_](US|MX|419)/i.test(v.lang))||l[0]||null;
}
speechSynthesis.addEventListener('voiceschanged',pickVoice);pickVoice();

/* Respaldo: si se cuela algún símbolo, se convierte en palabras antes de hablar */
const SYM={'+':' más ','−':' menos ','×':' por ','÷':' entre ','=':' igual ','²':' al cuadrado ','³':' al cubo ','√':' raíz cuadrada de ','π':' pi ','≤':' menor o igual que ','≥':' mayor o igual que ','≠':' distinto de ','{':' abre llave ','}':' cierra llave ','(':' abre paréntesis ',')':' cierra paréntesis ','[':' abre corchete ',']':' cierra corchete ','<':' menor que ','>':' mayor que ','/':' barra ','%':' por ciento ','&':' y ','^':' elevado a '};
const clean=t=>t.replace(/(\d)\.(\d)/g,'$1 punto $2').replace(/ - /g,' menos ').replace(/[+−×÷=²³√π≤≥≠{}()\[\]<>\/%&^]/g,c=>SYM[c]).replace(/[*#`_~|]/g,' ').replace(/\s+/g,' ').trim();
function split(t){
  const s=(clean(t).match(/[^.!?;:]+[.!?;:]*/g)||[]).flatMap(x=>x.length>180?x.match(/[^,]+,?/g):[x]);
  const o=[];let c='';
  for(const x of s){if(c&&(c+x).length>170){o.push(c.trim());c=''}c+=x+' '}
  if(c.trim())o.push(c.trim());
  return o;
}
function from(i){
  speechSynthesis.cancel();
  const k=++P.tok;P.i=i;P.pz=0;
  setTimeout(()=>nxt(k),80);
}
function nxt(k){
  if(k!==P.tok||!P.on||P.pz)return;
  const u=new SpeechSynthesisUtterance(P.ch[P.i]);
  if(V){u.voice=V;u.lang=V.lang}else u.lang='es-ES';
  u.onstart=()=>{if(k===P.tok)P.t0=performance.now()};
  u.onend=u.onerror=()=>{
    if(k!==P.tok)return;
    P.d[P.i]=performance.now()-P.t0;
    P.i++;let w=0;
    if(P.i>=P.ch.length){P.i=0;w=1500}
    setTimeout(()=>nxt(k),w||350);
  };
  speechSynthesis.speak(u);
}
function play(t){
  P.ch=split(t);P.d=[];
  if(!P.ch.length)return;
  P.on=1;session();from(0);
}
function pz(){
  if(!P.on||P.pz)return;
  P.pz=1;P.el=Math.max(0,performance.now()-P.t0);P.tok++;
  speechSynthesis.cancel();ps('paused');
}
function rz(){
  if(!P.on||!P.pz)return;
  let j=P.i,r=P.el;
  while(r<5000&&j>0){j--;r+=P.d[j]||2500}
  from(j);ps('playing');
}
function stop(){
  P.on=0;P.tok++;
  speechSynthesis.cancel();sil.pause();ps('none');
}
const ps=s=>{if('mediaSession' in navigator)navigator.mediaSession.playbackState=s};
function session(){
  if(!('mediaSession' in navigator))return;
  const m=navigator.mediaSession;
  m.metadata=new MediaMetadata({title:'Explicación en audio',artist:'Cero Fricción'});
  m.setActionHandler('play',()=>{sil.play().catch(()=>{});rz()});
  m.setActionHandler('pause',()=>{sil.pause();pz()});
  ps('playing');
}
/* Un audio silencioso en bucle mantiene viva la sesión de medios: los audífonos
   (pausa al quitarse uno, botón de play) controlan así la voz. */
(function(){
  const n=8000,b=new DataView(new ArrayBuffer(44+n)),s=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));
  s(0,'RIFF');b.setUint32(4,36+n,true);s(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
  b.setUint32(24,8000,true);b.setUint32(28,8000,true);b.setUint16(32,1,true);b.setUint16(34,8,true);s(36,'data');b.setUint32(40,n,true);
  for(let i=0;i<n;i++)b.setUint8(44+i,128);
  sil.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
})();
sil.addEventListener('pause',pz);
sil.addEventListener('play',rz);
function unlockAudio(){
  sil.play().catch(()=>{});
  const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);
}

/* ---------- Flujo: toque → foto → análisis → audio ---------- */
let mode='live',lock=0;
st.addEventListener('pointerup',e=>{
  if(e.target.closest('.ctl')||Date.now()<lock)return;
  lock=Date.now()+600;
  if(mode==='live')shoot();
  else if(mode==='result')back();
});
async function shoot(){
  if(!S.key){openSet();return}
  if(!stream||vid.readyState<2){say('La cámara aún no está lista');return}
  mode='busy';say('Capturando…',1);unlockAudio();
  try{
    const b64=await snap();
    st.classList.add('res');say('Analizando…',1);
    const t=await ask(b64);
    mode='result';play(t);say('Reproduciendo. Toca para una nueva foto');
  }catch(err){
    mode='result';st.classList.add('res');
    say('Error: '+String(err.message||err).slice(0,90)+'. Toca para volver');
  }
}
function back(){stop();mode='live';st.classList.remove('res');say('')}

/* ---------- Ajustes ---------- */
function sync(){
  sheet.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(S[g.dataset.k])===b.dataset.v)));
}
function openSet(){keyI.value=S.key;sync();sheet.classList.add('open')}
$('#gear').onclick=openSet;
$('#ok').onclick=()=>sheet.classList.remove('open');
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};
keyI.oninput=()=>{S.key=keyI.value.trim();save()};
sheet.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const k=g.dataset.k;S[k]=k==='zoom'?+b.dataset.v:b.dataset.v;save();sync();
  if(k==='zoom')setZoom(S.zoom);
});

/* ---------- Arranque ---------- */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&mode==='live'&&(!stream||stream.getTracks()[0].readyState!=='live'))cam();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
cam();
if(!S.key)openSet();
</script>
</body>
</html>
